<!-- CURSOR PARTICLE TRAIL - ESTELA NEGRA -->
<canvas id="particle-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<style>
  * { cursor: none !important; }
  a, button { cursor: none !important; }
</style>
<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = {x: -100, y: -100};
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
window.addEventListener('mousemove', (e)=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
  for(let i=0;i<3;i++){
    particles.push({
      x: e.clientX + (Math.random()-0.5)*8,
      y: e.clientY + (Math.random()-0.5)*8,
      vx: (Math.random()-0.5)*1.5,
      vy: (Math.random()-0.5)*1.5,
      size: Math.random()*4+1.5,
      life: 1,
      decay: 0.015 + Math.random()*0.02
    });
  }
});
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
    if(Math.random() > 0.6){
      ctx.fillStyle = 'rgba(0,0,0,' + (p.life*0.4) + ')';
      ctx.fillRect(p.x + (Math.random()-0.5)*6, p.y + (Math.random()-0.5)*6, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1;
  ctx.stroke();
  requestAnimationFrame(animate);
}
animate();
if('ontouchstart' in window){ canvas.style.display='none'; document.querySelectorAll('*').forEach(el=>el.style.cursor='auto'); }
const g=document.getElementById('gal');
document.getElementById('openG').onclick=()=>{g.style.transform='translateY(0)';document.body.style.overflow='hidden'};
document.getElementById('closeG').onclick=()=>{g.style.transform='translateY(100%)';document.body.style.overflow='';};
</script>
