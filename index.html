<!-- CURSOR SYSTEM -->
<!-- Canvas para mini partículas -->
<canvas id="particle-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;"></canvas>
<!-- Cursor custom -->
<div id="cursor-dot" style="position:fixed;top:0;left:0;width:5px;height:5px;background:#000;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);"></div>
<div id="cursor-ring" style="position:fixed;top:0;left:0;width:26px;height:26px;border:1px solid rgba(0,0,0,0.25);border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width 0.2s ease,height 0.2s ease,border-color 0.2s ease;"></div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let particles = [];
let mouse = { x: -100, y: -100 };
let ringPos = { x: -100, y: -100 };
let isHovering = false;
let galleryOpen = false;

function resize(){ 
  canvas.width = window.innerWidth * window.devicePixelRatio;
  canvas.height = window.innerHeight * window.devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
resize(); 
window.addEventListener('resize', resize);

// Detectar si galería está abierta para cambiar color
const gal = document.getElementById('gal');
const observer = new MutationObserver(()=>{
  galleryOpen = !gal.style.transform.includes('100%');
});
observer.observe(gal, {attributes:true, attributeFilter:['style']});

window.addEventListener('mousemove', (e)=>{
  mouse.x = e.clientX; 
  mouse.y = e.clientY;
  
  // dot sigue instant
  dot.style.left = e.clientX + 'px';
  dot.style.top = e.clientY + 'px';

  // Crear mini partículas - solo si se mueve suficiente
  const amount = isHovering ? 4 : 2;
  for(let i=0;i<amount;i++){
    particles.push({
      x: e.clientX + (Math.random()-0.5)*6,
      y: e.clientY + (Math.random()-0.5)*6,
      vx: (Math.random()-0.5)*1.2,
      vy: (Math.random()-0.5)*1.2,
      size: Math.random()*1.8 + 0.3, // MINI: 0.3px a 2.1px
      life: 1,
      decay: 0.018 + Math.random()*0.03,
      type: Math.random() > 0.85 ? 'square' : 'dot' // 15% cuadraditos glitch
    });
  }
});

// Hover effect
document.querySelectorAll('a, button, img').forEach(el=>{
  el.addEventListener('mouseenter', ()=>{
    isHovering = true;
    ring.style.width = '42px';
    ring.style.height = '42px';
    ring.style.borderColor = 'rgba(0,0,0,0.5)';
    ring.style.background = 'rgba(0,0,0,0.04)';
  });
  el.addEventListener('mouseleave', ()=>{
    isHovering = false;
    ring.style.width = '26px';
    ring.style.height = '26px';
    ring.style.borderColor = 'rgba(0,0,0,0.25)';
    ring.style.background = 'transparent';
  });
});

function animate(){
  // Limpiar con tamaño CSS, no físico
  ctx.clearRect(0,0,window.innerWidth, window.innerHeight);

  // Ring con lerp suave (sigue con retraso)
  ringPos.x += (mouse.x - ringPos.x) * 0.15;
  ringPos.y += (mouse.y - ringPos.y) * 0.15;
  ring.style.left = ringPos.x + 'px';
  ring.style.top = ringPos.y + 'px';

  // Dibujar partículas
  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];
    p.x += p.vx; 
    p.y += p.vy;
    p.vx *= 0.98; 
    p.vy *= 0.98;
    // leve gravedad / drift
    p.vy += 0.02;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    
    ctx.globalAlpha = p.life;
    // Color adaptativo: blanco en galería, negro en web blanca
    const baseColor = galleryOpen ? 255 : 0;
    ctx.fillStyle = `rgba(${baseColor},${baseColor},${baseColor},${p.life})`;

    if(p.type === 'square'){
      ctx.fillRect(p.x, p.y, p.size, p.size);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);
}
animate();

// Desactivar en touch
if('ontouchstart' in window || window.matchMedia('(pointer: coarse)').matches){ 
  canvas.style.display='none'; 
  dot.style.display='none';
  ring.style.display='none';
  document.documentElement.style.cursor = 'auto';
  document.querySelectorAll('*').forEach(el=>el.style.setProperty('cursor','auto','important'));
}

// Galería
document.getElementById('openG').onclick=()=>{
  gal.style.transform='translateY(0)';
  document.body.style.overflow='hidden';
  galleryOpen = true;
};
document.getElementById('closeG').onclick=()=>{
  gal.style.transform='translateY(100%)';
  document.body.style.overflow='';
  galleryOpen = false;
};
</script>
