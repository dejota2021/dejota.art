<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dejota</title>
<link rel="icon" type="image/png" href="img/dejota_logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#ffffff;color:#000}</style>
</head>
<body class="bg-white antialiased">
<!-- PORTADA NUEVA - SOLO PNG -->
<section class="relative w-full min-h-screen bg-white flex items-center justify-center">
  <img src="img/Shows.jpg" alt="dejota - SLQTCEFk MOOD" class="w-full h-auto max-w-[1600px] mx-auto object-contain">
</section>

<!-- SPOTIFY -->
<section class="px-3 md:px-10 py-8 bg-[#070708]">
 <div class="max-w-[900px] mx-auto">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/5NpCde9H57MxIZqbmfkElY?utm_source=generator&theme=0" width="100%" height="500" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
 </div>
</section>

<!-- GALERIA OVERLAY -->
<div id="gal" class="fixed inset-0 z-[100] bg-[#050505] translate-y-full transition-transform duration-[600ms] overflow-y-auto">
  <div class="sticky top-0 z-10 flex justify-between items-center px-6 md:px-10 py-5 bg-[#050505]/90 backdrop-blur-xl border-b border-white/10">
    <span class="text-white text-[12px] tracking-[0.3em]">GALERÍA</span>
    <button id="closeG" class="w-10 h-10 rounded-full border border-white/20 bg-white/5 text-white flex items-center justify-center">✕</button>
  </div>
  <div class="px-3 md:px-6 py-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
    <img src="img/distribucion_5.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/distribucion_4.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/distribucion_3.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/distribucion_2.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/distribucion_1.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF7539.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF7551.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF7560.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF7574.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF6944.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF6946.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]"><img src="img/DSCF6959.jpg" class="rounded-[18px] aspect-[4/5] object-cover bg-[#111]">
  </div>
</div>

<nav class="fixed top-0 w-full z-40 flex justify-between items-center px-6 md:px-10 py-5 bg-white/70 backdrop-blur-xl border-b border-black/5">
 <span class="text-black font-bold tracking-[0.2em] text-[12px]">DEJOTA®</span>
 <button id="openG" class="text-[11px] tracking-[0.25em] uppercase px-5 py-2 rounded-full border border-black/15 text-black hover:bg-black/5 transition">GALERÍA</button>
</nav>

<footer class="px-6 md:px-10 py-10 flex justify-between text-[10px] tracking-[0.2em] uppercase opacity-40 border-t border-black/5 bg-white text-black">
 <span>© 2026 dejota.art</span><a href="https://instagram.com/dejota2021">IG: @dejota2021</a>
</footer>

<script>const g=document.getElementById('gal');document.getElementById('openG').onclick=()=>{g.style.transform='translateY(0)';document.body.style.overflow='hidden'};document.getElementById('closeG').onclick=()=>{g.style.transform='translateY(100%)';document.body.style.overflow=''};</script>
</body>
</html>
