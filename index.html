<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dejota</title>
<link rel="icon" type="image/png" href="img/dejota_logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#fff;color:#000}
  @media (pointer: fine){ *{cursor:none !important} a,button{cursor:none !important} }
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  /* mini carrete top - MAS GRANDE */
  #miniWrap{height:96px;background:#000;overflow:hidden;position:relative;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08);touch-action:pan-y}
  @media(max-width:768px){#miniWrap{height:84px}}
  #miniTrack{display:flex;gap:8px;will-change:transform;height:100%;align-items:center;padding:0 8px}
  .mini-item{flex:0 0 auto;width:148px;height:78px;border-radius:12px;overflow:hidden;background:#111;cursor:pointer;border:1px solid rgba(255,255,255,.14);transition:transform .2s, border-color .2s}
  .mini-item:hover{transform:scale(1.04);border-color:rgba(255,255,255,.4)}
  @media(max-width:768px){.mini-item{width:124px;height:68px;border-radius:10px}}
  .mini-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  /* big overlay */
  #bigOverlay{position:fixed;inset:0;z-index:120;background:rgba(5,5,5,.96);backdrop-filter:blur(18px);display:none;flex-direction:column;opacity:0;transition:opacity .35s}
  #bigOverlay.open{display:flex;opacity:1}
  #bigTrackWrap{flex:1;overflow:hidden;display:flex;align-items:center;position:relative;touch-action:pan-y}
  #bigTrack{display:flex;gap:14px;will-change:transform;padding:0 40px}
  .big-item{flex:0 0 auto;width:78vw;max-width:900px;height:72vh;max-height:720px;border-radius:22px;overflow:hidden;background:#111;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  @media(min-width:1024px){.big-item{width:62vw;height:78vh}}
  .big-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  #bigClose{position:absolute;top:18px;right:18px;z-index:10;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff}
</style>
</head>
<body class="bg-white antialiased">

<nav class="fixed top-0 w-full z-40 flex justify-between items-center px-6 md:px-10 py-5 bg-white/70 backdrop-blur-xl border-b border-black/5">
 <span class="font-bold tracking-[0.2em] text-[12px]">DEJOTA®</span>
 <span class="text-[9px] tracking-[0.25em] uppercase opacity-40">MED — 2026</span>
</nav>

<!-- CARRETE MAS GRANDE -->
<div class="pt-[64px] bg-black">
  <div id="miniWrap" class="no-scrollbar">
    <div id="miniTrack"></div>
  </div>
</div>

<section class="relative w-full bg-white flex items-center justify-center">
  <img src="img/Shows.jpg" alt="dejota" class="w-full max-w-[1600px] mx-auto object-contain" onerror="this.src='img/shows.jpg'">
</section>

<!-- SPLIT VIDEO + SPOTIFY -->
<section class="w-full bg-[#070708] px-3 md:px-4 py-4 md:py-6">
  <div class="max-w-[1700px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-3 md:gap-4 items-stretch">
    <div id="videoWrap" class="relative w-full bg-black rounded-[20px] overflow-hidden aspect-video lg:aspect-[16/9.5] group cursor-pointer">
      <div id="videoFacade" class="absolute inset-0 w-full h-full">
        <img src="https://img.youtube.com/vi/vFhUfgFUBVk/maxresdefault.jpg" alt="Dejota Video" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-500">
        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-[68px] h-[68px] md:w-[84px] md:h-[84px] rounded-full bg-white text-black flex items-center justify-center shadow-[0_0_40px_rgba(255,255,255,0.2)] group-hover:scale-110 transition duration-300">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="ml-[3px]"><path d="M8 5.14v14l11-7-11-7z"/></svg>
          </div>
        </div>
        <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-white/10 backdrop-blur text-white text-[9px] tracking-[0.3em] border border-white/10">VIDEO</div>
      </div>
    </div>
    <div class="relative w-full bg-[#121212] rounded-[20px] overflow-hidden p-3 flex flex-col min-h-[400px] lg:min-h-[520px]">
      <div class="flex justify-between items-center px-2 pb-3"><span class="text-white/40 text-[9px] tracking-[0.3em] uppercase">SPOTIFY / TOP TRACKS</span><span class="w-2 h-2 bg-[#1DB954] rounded-full animate-pulse"></span></div>
      <iframe id="spotifyFrame" src="https://open.spotify.com/embed/artist/5NpCde9H57MxIZqbmfkElY?utm_source=generator&theme=0" width="100%" height="100%" class="flex-1 rounded-[12px] min-h-[450px]" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe>
    </div>
  </div>
</section>

<section class="w-full bg-white pt-8 pb-2 px-6 md:px-10">
  <h2 class="text-[10px] tracking-[0.35em] uppercase opacity-30">archivo visual — 13 piezas</h2>
</section>

<footer class="px-6 md:px-10 py-10 flex justify-between text-[10px] tracking-[0.2em] uppercase opacity-40 border-t border-black/5 bg-white"><span>© 2026 dejota.art</span><a href="https://instagram.com/dejota2021">IG: @dejota2021</a></footer>

<!-- OVERLAY GRANDE -->
<div id="bigOverlay">
  <button id="bigClose">✕</button>
  <div id="bigTrackWrap" class="no-scrollbar">
    <div id="bigTrack"></div>
  </div>
  <div class="px-8 pb-6 flex justify-between items-center">
    <span class="text-white/30 text-[9px] tracking-[0.3em] uppercase">desliza / mueve el dedo para cambiar dirección • click fuera cierra</span>
    <span class="text-white/20 text-[9px] tracking-[0.2em]">ESC</span>
  </div>
</div>

<canvas id="pc" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;"></canvas>
<div id="dot" style="position:fixed;width:5px;height:5px;background:#000;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%)"></div>
<div id="ring" style="position:fixed;width:26px;height:26px;border:1px solid rgba(0,0,0,.25);border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:.2s"></div>

<script>
const all=["img/distribucion_5.jpg","img/distribucion_4.jpg","img/distribucion_3.jpg","img/distribucion_2.jpg","img/distribucion_1.jpg","img/DSCF7539.jpg","img/DSCF7551.jpg","img/DSCF7560.jpg","img/DSCF7574.jpg","img/DSCF6944.jpg","img/DSCF6946.jpg","img/DSCF6959.jpg","img/DSCF6919.jpg"];

const miniTrack=document.getElementById('miniTrack');
const bigTrack=document.getElementById('bigTrack');
const miniWrap=document.getElementById('miniWrap');
const bigOverlay=document.getElementById('bigOverlay');
const bigWrap=document.getElementById('bigTrackWrap');

function buildTracks(){
  const total = [...all, ...all, ...all, ...all];
  total.forEach((src,i)=>{
    const el=document.createElement('div'); el.className='mini-item'; el.dataset.idx=i % all.length;
    el.innerHTML=`<img src="${src}" loading="lazy" onerror="this.src=this.src.toLowerCase()">`;
    el.addEventListener('click', ()=> openBig(i % all.length));
    miniTrack.appendChild(el);
  });
  total.forEach((src)=>{
    const el=document.createElement('div'); el.className='big-item group';
    el.innerHTML=`<img src="${src}" loading="lazy" onerror="this.src=this.src.toLowerCase()">`;
    bigTrack.appendChild(el);
  });
}
buildTracks();

// VELOCIDAD REDUCIDA 30% (antes 0.8 -> ahora 0.56)
let velMini = 0.56;
let velBig = 0.63;
let targetMini = 0.56;
let targetBig = 0.63;
let lastMouseX = 0;
let offsetMini=0;
let offsetBig=0;

function lerp(a,b,t){ return a + (b-a)*t; }

function loop(){
  offsetMini += velMini;
  offsetBig += velBig;
  const halfMini = miniTrack.scrollWidth/2;
  if(offsetMini > halfMini) offsetMini -= halfMini;
  if(offsetMini < 0) offsetMini += halfMini;
  const halfBig = bigTrack.scrollWidth/2;
  if(offsetBig > halfBig) offsetBig -= halfBig;
  if(offsetBig < 0) offsetBig += halfBig;

  miniTrack.style.transform = `translateX(${-offsetMini}px)`;
  bigTrack.style.transform = `translateX(${-offsetBig}px)`;

  velMini = lerp(velMini, targetMini, 0.045); // más suave
  velBig = lerp(velBig, targetBig, 0.045);

  // mínimo nunca 0, reducido 30% también (antes 0.25 -> 0.175)
  if(Math.abs(velMini) < 0.175) velMini = velMini >=0 ? 0.175 : -0.175;
  if(Math.abs(velBig) < 0.175) velBig = velBig >=0 ? 0.175 : -0.175;

  requestAnimationFrame(loop);
}
loop();

// MOUSE GLOBAL - dirección continua
document.addEventListener('mousemove', (e)=>{
  const dx = e.clientX - lastMouseX;
  if(Math.abs(dx) > 1){
    const dir = dx > 0 ? -1 : 1;
    // intensidad reducida 30%: antes 0.12*dx+0.6 max 3.2 -> ahora 0.084*dx+0.42 max 2.24
    const intensity = Math.min(Math.abs(dx)*0.084 + 0.42, 2.24);
    targetMini = dir * intensity;
    if(bigOverlay.classList.contains('open')){
      targetBig = dir * (intensity*1.1);
    }
  }
  lastMouseX = e.clientX;
});

// Hover sobre mini: controla dirección por posición (más intuitivo)
miniWrap.addEventListener('mousemove', (e)=>{
  const rect=miniWrap.getBoundingClientRect();
  const rel = (e.clientX - rect.left)/rect.width;
  const centered = rel - 0.5;
  // reducido 30%: antes 4.5 -> 3.15
  targetMini = centered * 3.15;
  if(Math.abs(targetMini) < 0.2) targetMini = targetMini >=0 ? 0.2 : -0.2;
});

// TOUCH CELULAR - inercia que continúa
let touchStartX=0, lastTouchX=0, touchVel=0, touchRaf=null;
let touchActive=false;

function handleTouchStart(e){
  touchActive=true;
  touchStartX=e.touches[0].clientX;
  lastTouchX=touchStartX;
  touchVel=0;
}
function handleTouchMove(e){
  if(!touchActive) return;
  const curX=e.touches[0].clientX;
  const dx=curX - lastTouchX;
  touchVel = dx; // velocidad instantánea
  lastTouchX=curX;
  // dirección invertida para carrete
  const dir = dx > 0 ? -1 : 1;
  const intensity = Math.min(Math.abs(dx)*0.06 + 0.35, 2.2);
  targetMini = dir * intensity;
  if(bigOverlay.classList.contains('open')){
    targetBig = dir * intensity * 1.1;
  }
}
function handleTouchEnd(){
  touchActive=false;
  // la velocidad target se mantiene con la última inercia, no se resetea a 0 -> continúa
  // dejamos que siga con la última dirección calculada
  const finalDir = touchVel > 0 ? -1 : 1;
  const finalInt = Math.min(Math.abs(touchVel)*0.05 + 0.4, 1.8);
  targetMini = finalDir * finalInt;
  if(bigOverlay.classList.contains('open')) targetBig = finalDir * finalInt * 1.1;
}

miniWrap.addEventListener('touchstart', handleTouchStart, {passive:true});
miniWrap.addEventListener('touchmove', handleTouchMove, {passive:true});
miniWrap.addEventListener('touchend', handleTouchEnd, {passive:true});

bigWrap.addEventListener('touchstart', handleTouchStart, {passive:true});
bigWrap.addEventListener('touchmove', handleTouchMove, {passive:true});
bigWrap.addEventListener('touchend', handleTouchEnd, {passive:true});

// Abrir grande
function openBig(idx){
  bigOverlay.classList.add('open');
  bigOverlay.style.display='flex';
  document.body.style.overflow='hidden';
  const itemW = 914; // 900+14
  offsetBig = idx * itemW;
  targetBig = targetMini !==0 ? targetMini*1.05 : 0.63;
  requestAnimationFrame(()=> bigOverlay.classList.add('open'));
}
function closeBig(){
  bigOverlay.classList.remove('open');
  setTimeout(()=>{ bigOverlay.style.display='none'; document.body.style.overflow=''; }, 300);
}
document.getElementById('bigClose').onclick=closeBig;
bigOverlay.addEventListener('click', (e)=>{ if(e.target === bigOverlay || e.target === bigWrap) closeBig(); });
bigWrap.addEventListener('click', (e)=>{ if(!e.target.closest('.big-item')) closeBig(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeBig(); });

// VIDEO
const videoWrap=document.getElementById('videoWrap');
if(videoWrap){
  videoWrap.addEventListener('click', () => {
    const iframe=document.createElement('iframe');
    iframe.className='w-full h-full absolute inset-0';
    iframe.src='https://www.youtube.com/embed/vFhUfgFUBVk?autoplay=1&rel=0&modestbranding=1&controls=1&playsinline=1';
    iframe.title='Dejota Video'; iframe.frameBorder='0';
    iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture'; iframe.allowFullscreen=true;
    videoWrap.innerHTML=''; videoWrap.appendChild(iframe);
  }, { once: true });
}

// SPOTIFY autoplay al interactuar
let musicStarted=false;
function startMusic(){
  if(musicStarted) return;
  musicStarted=true;
  const sp=document.getElementById('spotifyFrame');
  const base = 'https://open.spotify.com/embed/artist/5NpCde9H57MxIZqbmfkElY?utm_source=generator&theme=0';
  sp.src = base + '&autoplay=1';
  ['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(ev=> document.removeEventListener(ev, startMusic));
}
['click','keydown','mousemove','touchstart','scroll','wheel'].forEach(ev=>{
  document.addEventListener(ev, startMusic, {once:true, passive:true});
});

// CURSOR
const canvas=document.getElementById('pc'),ctx=canvas.getContext('2d'),dot=document.getElementById('dot'),ring=document.getElementById('ring');let particles=[],mouse={x:-100,y:-100},rp={x:-100,y:-100},hov=false;
function rs(){const d=window.devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);}rs();addEventListener('resize',rs);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';for(let k=0;k<(hov?4:2);k++)particles.push({x:e.clientX+(Math.random()-0.5)*6,y:e.clientY+(Math.random()-0.5)*6,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2,size:Math.random()*1.8+0.3,life:1,dec:0.018+Math.random()*0.03,t:Math.random()>0.85?'sq':'d'})});
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>{hov=true;ring.style.width='42px';ring.style.height='42px'});el.addEventListener('mouseleave',()=>{hov=false;ring.style.width='26px';ring.style.height='26px'})});
function anim(){ctx.clearRect(0,0,innerWidth,innerHeight);rp.x+=(mouse.x-rp.x)*0.15;rp.y+=(mouse.y-rp.y)*0.15;ring.style.left=rp.x+'px';ring.style.top=rp.y+'px';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.98;p.vy*=0.98;p.vy+=0.02;p.life-=p.dec;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=`rgba(0,0,0,${p.life})`;if(p.t==='sq')ctx.fillRect(p.x,p.y,p.size,p.size);else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;requestAnimationFrame(anim)}anim();
if('ontouchstart' in window) {canvas.style.display='none';dot.style.display='none';ring.style.display='none'}
</script>
</body>
</html>
