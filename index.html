
<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dejota</title>
<link rel="icon" type="image/png" href="img/dejota_white_transparent.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#070708;color:#f5f5f5}</style></head>
<body>
<nav style="position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:20px 40px;background:rgba(7,7,8,0.6);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);z-index:40">
<img src="img/dejota_white_transparent.png" style="height:28px"><button id="openG" style="font-size:11px;letter-spacing:0.25em;text-transform:uppercase;padding:8px 20px;border-radius:999px;border:1px solid rgba(255,255,255,0.15)">GALERIA</button>
</nav>
<section style="min-height:85vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding-top:68px">
<img src="img/DSCF6919.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.6">
<div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(7,7,8,0.2), rgba(7,7,8,1))"></div>
<img src="img/dejota_white_transparent.png" style="position:relative;z-index:10;width:520px;max-width:80vw">
</section>
<section style="padding:32px 12px;background:#070708;max-width:900px;margin:0 auto">
<iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/5NpCde9H57MxIZqbmfkElY?utm_source=generator&theme=0" width="100%" height="500" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</section>
<div id="gal" style="position:fixed;inset:0;background:#050505;transform:translateY(100%);transition:0.6s;overflow:auto;z-index:100">
<div style="position:sticky;top:0;display:flex;justify-content:space-between;padding:20px 40px;background:rgba(5,5,5,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1)"><img src="img/dejota_white_transparent.png" style="height:24px"><button id="closeG" style="width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,0.15)">X</button></div>
<div style="padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
<img src="img/distribucion_5.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/distribucion_4.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/distribucion_3.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/distribucion_2.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/distribucion_1.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF7539.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF7551.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF7560.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF7574.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF6944.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF6946.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover"><img src="img/DSCF6959.jpg" style="border-radius:18px;aspect-ratio:4/5;object-fit:cover">
</div></div>
<script>const g=document.getElementById('gal');document.getElementById('openG').onclick=()=>g.style.transform='translateY(0)';document.getElementById('closeG').onclick=()=>g.style.transform='translateY(100%)';</script>
</body></html>
